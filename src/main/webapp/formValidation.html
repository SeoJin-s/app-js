<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<h1>로그인</h1>
	<form method="post" action="/loginAction" id="loginForm">
		<div>
			ID : 
			<input type="text" name="id" id="id" class="">
		</div>
			<div>
			PW : 
			<input type="password" name="pw" id="pw" class="">
		</div>
		<button type="button" onclick="loginCheck()">로그인</button> <!-- onclick 이 버튼을 클릭하면 loginCheck 함수가 호출된다.-->
	</form>
	<script type="text/javascript">
		function loginCheck() {	// 입력값 없고 반환값도 없다.
			//alert('버튼 test?');
		if(document.getElementById('id').value === '' || document.getElementById('pw').value === '' ) {
			alert('id와 pw를 입력하세요')
			 return;
		}
			document.getElementById('loginForm').submit(); // <button type="button"...태그와 동일
		}
		</script>
</body>
</html>
