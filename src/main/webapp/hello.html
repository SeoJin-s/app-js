			    console.log('!==연산자:', '777' !== 777); 	 // 정확한 연산

			    // 피연산자가 같은 자료형임을 확신하면 느슨한 연산자를 사용해도 상관없다.

					 s = a * 10;

			     출력방법

			     3) html 페이지에 출력 : document.write() <- 쓰지않는다.

			    */
			    
			     console.log('test');
