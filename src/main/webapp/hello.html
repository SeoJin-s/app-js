<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
		<title>Insert title here</title>
			
			<script>
			    let str = 'goodee academy';
			    console.log(str);   // ✅ goodee academy
			
			    str = "Goodee Academy";
			    console.log(str);   // ✅ Goodee Academy
			    
			    str = "test\"test";
			    console.log(str);
			    str = 'test"test';
			    console.log(str);
			    
			    // 1.백틱키워드를 사용하면 멀티라인 문자열 표현이 가능하다 
			    str = `goodee 
			    		academy`;
			    console.log(str);
			    
			    let x = 5;
			    let y = 7;
			    console.log(x + '*' + y + '=' + (x*y));
			    
			    // 2.백틱문자열은 문자열안에 표현식 사용이 가능하다 - jsp에서 사용하면 EL과 충돌이 일어난다 그래서 jsp에서는 사용 하지않는다.
			    console.log(`${x}*${y}=${x*y}`);
			    
			    let name = "구디";
			    console.log('당신의 이름은' + name + '입니다');
			    console.log(`당신의 이름은 ${name} 입니다`);
			    
			    // 자바스크립트의 문자열은 인덱스가 존재한다.
			    console.log(name[0]);	// 구
			    console.log(name[1]);	// 디
			    console.log('문자열 길이:',name.length); 
			    
			</script>
</head>
<body>
	
</body>
</html>
